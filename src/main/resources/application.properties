server.port=${PORT:8080}

# Stockfish configuration
stockfish.download-url=https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-windows-x86-64-sse41-popcnt.zip
stockfish.binary-dir=./bin
stockfish.binary-path=./bin/stockfish.exe

# Maximum time (in milliseconds) the engine can think per move
stockfish.default-movetime=1000
# Default depth the engine will search
stockfish.default-depth=15
# Default ELO rating target
stockfish.default-elo=3200

# Google OAuth 2.0 Credentials (Optional)
google.oauth.client-id=${GOOGLE_CLIENT_ID:275182809772-sobrhit7srg97o74fbs7ud3uslm09de8.apps.googleusercontent.com}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173}

# PostgreSQL Database Configuration (Supports Render, Supabase, Neon, Railway, Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Chess-Engine}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2108@Das}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OpenRouter Cloud AI Configuration
openrouter.api-key=${OPENROUTER_API_KEY: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}
openrouter.model=${OPENROUTER_MODEL:qwen/qwen-2.5-7b-instruct}


